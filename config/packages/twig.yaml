# file ~/Sites/blog/config/packages/twig.yaml

twig:
    default_path: '%kernel.project_dir%/templates'
    paths:
        '/var/www/shared_templates': shared
    form_themes: ['bootstrap_5_layout.html.twig']
    file_name_pattern: '*.twig'
    strict_variables: true
    debug: true
    globals:
        app_name: 'blog'
        app_domain: 'pendoncete.org'
        app_cookie_domain: '%env(resolve:COOKIE_DOMAIN)%'
        app_auth_base_url: '%env(resolve:AUTH_BASE_URL)%'
        app_cdn: '%env(CDN)%'

        # header sticky scroll offset heights
        # the variables app_header_sticky_offset_mobile and app_header_sticky_offset_desktop set
        # how much of the header scrolls away before the navbar sticks.
        # - increase values if you see branding text leaking when scrolled.
        # - decrease values if the sticky navbar disappears too early.
        # - use rems (pixels / 16) to ensure stability across high-DPI and zoomed screens.
        app_header_sticky_offset_mobile: '3.8rem'
        app_header_sticky_offset_desktop: '4.4rem'
