# file ~/Sites/blog/config/packages/doctrine.yaml

doctrine:
    dbal:
        connections:
            # primary application connection:
            default:
                url: '%env(resolve:DATABASE_URL)%'
                server_version: 'mariadb-10.5.29'
                # ignore auth_users_virtual during schema introspection/migrations
                schema_filter: '~^(?!auth_users_virtual)~'
            # the cross-app read connection to the auth database:
            auth_db:
                url: '%env(resolve:AUTH_DATABASE_URL)%'
                server_version: 'mariadb-10.5.29'

    orm:
        default_entity_manager: default
        entity_managers:
            default:
                connection: default
                naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
                mappings:
                    App:
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Entity'
                        prefix: 'App\Entity'
                        alias: App
            auth:
                connection: auth_db
                naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
                mappings:
                    AuthApp:
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Entity'
                        prefix: 'App\Entity'
                        alias: AuthApp
