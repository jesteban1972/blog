error_messages:
    base: "ὤχ! κάτι πῆγε στραβὰ στὴ λογική μου. προσπαθῶ αὐτὴ τὴ στιγμὴ νὰ διαπραγματευτῶ μία συνθήκη εἰρήνης μὲ τὸν διακομιστῆ :)"
    db: "ὤχ! ἡ βάσι δεδομένων μου ἀποφάσισε νὰ κάνῃ ἕνα ἐκτὸς προγράμματος διάλειμμα γιὰ καφφέ. θὰ ἐπιστρέψῃ μόλις τελειώσῃ τὸν ἐσπρέσσο της :)"
    401: "ὤχ! ὁ διακομιστής μου ἔπαθε μία μικρὴ ἀμνησία καὶ ξέχασε ποιὸς εἶσαι. πᾶμε στὴ σελίδα συνδέσεως γιὰ νὰ τοῦ φρεσκάρωμε τὴ μνήμη :)"
    403: "ὤχ! φαίνεται πὼς περιπλανήθηκες στὰ ἀπόῤῥητα ἀρχεῖα μας. ἀκόμα καὶ οἱ ἐξερευνητὲς χρειάζονται μία μυστικὴ χειραψία γιὰ νὰ μποῦν ἐδώ, καὶ δὲν τὴν ἔχουμε μάθει ἀκόμα σὲ ὅλους :)"
    404: "ὤχ! φαίνεται πὼς ἡ σελὶς ποὺ ψάχνεις ἔχει ἐξαφανιστεῖ στὸ ψηφιακὸ κενό. οὔτε ἡ ὁμὰς ἀναζητήσεώς μου δὲν μπορεῖ νὰ τὴ βρεῖ :)"
    500: "ὤχ! κάτι μέσα στὸ μηχανοστάσιό μου ἔκανε ἕναν περίεργο θόρυβο. οἱ ψηφιακοὶ μηχανικοί μου τὸ ἀναλαμβάνουν ἤδη :)"

