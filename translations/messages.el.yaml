info:
    markup: |
        <h2>πληροφορίες γιὰ τὴν ἐφαρμογὴ <i><strong>blog</strong></i></h2>
        <p>καλῶς ὅρισες στὸ <i><strong>blog</strong></i>, ἕναν ἱστοχῶρο ποὺ συγκεντρώνει τὶς προσωπικές μου σκέψεις, ὁδηγοὺς καὶ ἐνημερώσεις. αὐτὸ ποὺ θὰ βρῇς ἐδῶ εἶναι ἕνα ἀνοιχτὸ τετράδιο στοχασμῶν, δοκιμίων καὶ τεχνικῶν σημειώσεων, γραμμένων ἀπευθείας μέσα ἀπὸ τὴν δική μου ἐμπειρία καὶ τὴν ἐξελισσόμενη προοπτική μου.</p>
        <p>θεωρῶ τὸν ἑαυτό μου ἕναν ἀπέραντα περίεργο ἄνθρωπο, μὲ ἕνα εὐρὺ φάσμα παθῶν ποὺ ἀρνοῦνται νὰ στριμωχτοῦν σὲ ἄκαμπτα καλούπια. τὰ ἐνδιαφέροντά μου ἐκτείνονται ἀπὸ τὶς αὐστηρὰ σαρκικὲς καὶ αἰσθησιακὲς διαστάσεις τῆς ἀνθρωπίνης ζωῆς —γιορτάζοντας τὸ πάθος, τὴν σωματικὴ ἡδονὴ καὶ τὴν ἰδιωτικὴ μνήμη— μέσῳ εὐρύτερων πολιτισμικῶν, πνευματικῶν καὶ τεχνικῶν ἀναζητήσεων. μπορεῖς νὰ βρῇς ἀπὸ δημοσιεύσεις ποὺ ἀναλύουν τὴν κλασικὴ ἱστορία, τὰ μεσαιωνικὰ χρονικά, τὶς πολυτονικὲς γλῶσσες ἢ τὴν σύνθετη ἀρχιτεκτονικὴ τοῦ ἱστοῦ, μέχρι στοχασμοὺς γιὰ τὴν προσωπικὴ ἐλευθερία, τὴν αἰσθητική, τὴν καθημερινὴ ζῳὴ καὶ τὶς ἀνακαλύψεις τῆς κάθε μέρας. γιὰ μένα, ἡ ἀνθρώπινη ἐμπειρία εἶναι ἕνα πλούσιο μωσαϊκὸ ὅπου τὸ πνευματικὸ καὶ τὸ σωματικὸ ἐμπλουτίζουν συνεχῶς τὸ ἕνα τὸ ἄλλο, χωρὶς προσποιήσεις ἢ τεχνητὰ ὅρια. αὐτὸ τὸ ἱστολόγιο εἶναι ὁ τόπος συνάντησης αὐτῶν τῶν διαφορετικῶν κόσμων, καταγεγραμμένων μὲ εἰλικρίνεια, χιοῦμορ καὶ σχολαστικὴ προσοχὴ στὶς λεπτομέρειες.</p>
        <p>δημοσιεύω μὲ ὑπερηφάνεια αὐτὸ τὸ ἱστολόγιο ἐντὸς τοῦ οικοσυστήματος ἐφαρμογῶν τοῦ <i><strong>pendoncete.org</strong></i>, προσφέροντας τὶς δημοσιεύσεις του ἐλεύθερα σὲ κάθε ἐνδιαφερόμενο ἀναγνώστη. ὡστόσο, γιὰ νὰ συμμετέχῃς ἐνεργὰ στὸ ἱστολόγιο μὲ τὴν δυνατότητα νὰ ἀφήνῃς σχόλια καὶ νὰ συμμετέχῃς στὶς συζητήσεις, εἶναι ἀπαραίτητο νὰ εἶσαι ἐγγεγραμμένος χρήστης (ἢ ὑποστηρικτής) στὸ δίκτυο ἐφαρμογῶν τοῦ <i><strong>pendoncete.org</strong></i>.</p>
        <p>ἐξερεύνησε τὶς δημοσιεύσεις, κράτησε ὅ,τι μιλᾶ στὴν καρδιά σου καὶ ἀπόλαυσε τὴν ἀνάγνωσι!</p>
        <p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Pendoncete</p>
